# templates/secret.yaml
# K8s Secret holding the two sensitive env vars vault-api needs.
# Values are injected from global-secrets.yaml at helm install time.
# The Deployment reads from this Secret — raw values never appear in the Deployment spec.
apiVersion: v1
kind: Secret
metadata:
  name: vault-api-secret
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.vaultApi.secrets.databaseUrl | quote }}
  VAULT_ENCRYPTION_KEY: {{ .Values.vaultApi.secrets.encryptionKey | quote }}
