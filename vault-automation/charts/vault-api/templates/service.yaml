# templates/service.yaml
# ClusterIP Service — vault-api is not exposed directly to the internet.
# Kong sits in front of it and routes traffic here after JWT verification.
apiVersion: v1
kind: Service
metadata:
  name: vault-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: vault-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
