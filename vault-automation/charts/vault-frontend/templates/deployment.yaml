# templates/deployment.yaml
# No env vars needed — VITE_KEYCLOAK_URL and VITE_API_URL are baked into
# the React bundle at build time by the GitHub Actions workflow.
# The container just runs nginx and serves static files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vault-frontend
  template:
    metadata:
      labels:
        app: vault-frontend
    spec:
      containers:
        - name: vault-frontend
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
