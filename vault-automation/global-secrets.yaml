# global-secrets.yaml
# ─────────────────────────────────────────────────────────────────────────────
# SINGLE SOURCE OF ALL SECRETS — NEVER COMMIT THIS FILE. It is in .gitignore.
#
# Structure: keys are at root level matching each chart's expected schema.
# Helm ignores keys that a chart doesn't recognise — so all charts can safely
# receive this same file and only pick up what they need.
#
# Usage:
#   helm install <release> charts/<chart>/ \
#     -f overrides/<chart>.yaml \
#     -f global-secrets.yaml \
#     -n vault
# ─────────────────────────────────────────────────────────────────────────────

# ── auth ──────────────────────────────────────────────────────────────────────
# postgresql chart reads: postgresPassword, password, username, database
# keycloak chart reads:   adminUser, adminPassword
# (each chart ignores the keys it doesn't recognise)
auth:
  postgresPassword: "Vault@Pg#Super9!"   # postgres superuser
  password: "Vault@App#9!"               # vault app user (vault-api connects with this)
  username: vault
  database: vault
  adminUser: admin
  adminPassword: "Vault@Kc#Admin9!"      # Keycloak admin console password

# ── externalDatabase ──────────────────────────────────────────────────────────
# keycloak chart reads this to connect to our PostgreSQL instead of its bundled one.
externalDatabase:
  host: postgresql
  port: 5432
  user: keycloak
  database: keycloak
  password: "Vault@Kc#Pg9!"

# ── dbInit ────────────────────────────────────────────────────────────────────
# charts/db-init reads this to create the keycloak user in PostgreSQL.
# Must match externalDatabase.password above.
dbInit:
  keycloakDbPassword: "Vault@Kc#Pg9!"

# ── vaultApi ──────────────────────────────────────────────────────────────────
# charts/vault-api (our custom chart) reads this.
vaultApi:
  secrets:
    encryptionKey: "7tp_8g1vbKaif4mtqih8t3-dUfDGmzbRrptY3xoyz_0="
    # Special characters in the password must be URL-encoded:
    # @ → %40,  # → %23,  ! → %21
    # Without encoding, the URL parser mistakes the @ in the password
    # for the credential/host separator and reads the host as "App#9!@postgresql"
    databaseUrl: "postgresql://vault:Vault%40App%239%21@postgresql:5432/vault"

# ── imageCredentials ──────────────────────────────────────────────────────────
# For pulling images from GHCR if the repository is private.
imageCredentials:
  registry: ghcr.io
  username: ""       # GitHub username
  password: ""       # GitHub PAT with read:packages scope
