# ============================================================================
# shop-web -- EKS
#   helm upgrade --install shop-web ./shop-web -n shop -f values/shop-web-eks.yaml
# ============================================================================

image:
  repository: shashank04515/shop-web
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# 1, not 2. A t3.small allows 11 pods and kube-system uses 7 of them, leaving
# 4 slots for 3 app pods (api + web + postgres) plus one spare for a rolling
# update's surge pod. Two replicas each would not fit.
#
# Consequence to be aware of: with one replica this Deployment has no
# redundancy, and the PodDisruptionBudget is skipped automatically (the
# template requires replicaCount > 1) -- a PDB with minAvailable=1 over a
# single replica would block node drains forever.
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podAntiAffinity: true

backend:
  # Unchanged from minikube -- and that is the point. The address is an
  # in-cluster Service name, so it is identical in every environment. The
  # frontend image contains no hostname at all.
  url: http://shop-api:8000

ingress:
  enabled: false
  className: alb
  host: shop.example.com
  path: /
  annotations: {}
    # Give BOTH ingresses the same group.name and the controller provisions a
    # single shared ALB instead of one per Ingress -- ~$16/month instead of ~$32.
    # alb.ingress.kubernetes.io/group.name: shop
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
