{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shop-api.serviceAccountName" . }}
  labels: {{- include "shop-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # On EKS the IRSA role ARN goes here, giving pods AWS permissions via a
  # short-lived token instead of static access keys in a Secret.
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
