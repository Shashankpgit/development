{{- /*
Created only when you supplied a full URL instead of pointing at an existing
Secret.

WARNING that matters: a Kubernetes Secret is base64-ENCODED, not encrypted.
Anyone who can run `kubectl get secret -o yaml` in this namespace reads the
password in one command. For anything real, use database.existingSecret fed
from AWS Secrets Manager (Secrets Store CSI driver or External Secrets).
*/}}
{{- if and (not .Values.database.existingSecret) .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "shop-api.fullname" .) }}
  labels: {{- include "shop-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData takes the plain value; Kubernetes base64-encodes it for us.
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
