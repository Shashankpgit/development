{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "shop-api.fullname" . }}
  labels: {{- include "shop-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "shop-api.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # A percentage of the CPU *request*, not the limit. With
          # requests.cpu=100m, 70% means "scale up above 70m average".
          # Requires metrics-server, or the HPA reports <unknown> and never acts.
          #   minikube addons enable metrics-server
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # 5 minutes of calm before removing pods, so a brief dip does not cause
      # scale-down/scale-up thrashing.
      stabilizationWindowSeconds: 300
{{- end }}
