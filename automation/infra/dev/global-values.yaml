# ============================================================================
# Every value that defines the "dev" environment. One file, so a second
# environment is a copy of this directory with this file edited.
#
# COST NOTE -- what actually bills here.
#
# IMPORTANT ACCOUNT CONSTRAINT (discovered the hard way, 2026-09-08):
# this account is on an AWS **Free Tier plan**, which restricts EC2 to
# free-tier-ELIGIBLE instance types at the account level -- independent of the
# $300 credit balance. Anything else fails at launch with:
#   "InvalidParameterCombination - The specified instance type is not
#    eligible for Free Tier"
# and the node group sits in CREATING for ~25 minutes before failing.
#
# List what is permitted with:
#   aws ec2 describe-instance-types --filters Name=free-tier-eligible,Values=true
#
# In ap-south-1 that is: t3.micro, t3.small, t4g.micro, t4g.small,
# c7i-flex.large, m7i-flex.large.
#   - t4g.* are ARM (Graviton). Our images are linux/amd64, so they would
#     fail with "exec format error". Excluded.
#   - t3.micro allows only 4 pods, and kube-system alone needs 7. Unusable.
#   - c7i-flex.large / m7i-flex.large are roomy but 4-5x the hourly cost.
# t3.small is the cheapest type that can actually run Kubernetes plus this app.
#
#   EKS control plane   $0.10/hr    ~$73/month   <- flat, no free tier, ever
#   1x t3.small         $0.0224/hr  ~$16/month   <- ON_DEMAND; SPOT is also
#                                                   blocked on this plan
#   node root EBS 20GB  ~$1.60/month
#   Postgres PVC 8GB    ~$0.64/month
#   NAT Gateway         $0                       <- not created
#   Load Balancer       $0                       <- not created
#   -----------------------------------------------------------------------
#   running, 1 node     ~$0.122/hr = ~$2.95/day = ~$89/month
#   scaled to 0 nodes   ~$0.101/hr             = ~$74/month
#   destroyed           ~$0/month
#
# $300 of credits lasts ~3.3 months always-on. The control plane is ~82% of
# the bill, so ./destroy.sh remains the only meaningful saving.
# ============================================================================

global:
  # Prefix for every resource name. Keep it short: several AWS names have
  # tight length limits and EKS appends its own suffixes.
  name_prefix: shop-dev

  aws_region: ap-south-1

  # --- network -------------------------------------------------------------
  vpc_cidr: "10.20.0.0/16"
  # Two AZs is the MINIMUM -- EKS rejects a single-AZ cluster outright.
  az_suffixes: ["a", "b"]

  # --- eks control plane ---------------------------------------------------
  eks_cluster_version: "1.33"
  # true so kubectl reaches the cluster from your laptop with no VPN/bastion.
  eks_endpoint_public_access: true
  # Narrow this to "YOUR.PUBLIC.IP/32". It is free and strictly better than
  # letting the whole internet attempt to authenticate.
  eks_public_access_cidrs: ["0.0.0.0/0"]
  # Empty on purpose: control plane logging bills by ingestion and "audit" is
  # high volume. Add ["api", "audit"] temporarily to debug authorisation.
  eks_cluster_log_types: []

  # --- eks nodes -----------------------------------------------------------
  # t3.small: 2 vCPU, 2GB, **11 pods max**. Forced by the Free Tier plan (see
  # the cost note above) -- t3.medium is not free-tier-eligible and fails at
  # launch.
  #
  # The 11-pod ceiling is the binding constraint, not CPU or memory. On a
  # single node kube-system already uses 7:
  #   aws-node, kube-proxy, ebs-csi-node   (DaemonSets)   3
  #   coredns x2, ebs-csi-controller x2                   4
  # leaving 4 slots. Hence shop-api and shop-web run 1 replica each on EKS
  # (see values/shop-api-eks.yaml), for 3 app pods and 1 spare.
  #
  # To get more slots without a bigger instance, enable prefix delegation on
  # the vpc-cni addon (ENABLE_PREFIX_DELEGATION=true) -- it raises t3.small to
  # ~110 pods. Not done here because 2GB of RAM becomes the real limit anyway.
  eks_node_instance_type: t3.small
  # ON_DEMAND, not SPOT: the Free Tier plan blocks Spot too -- the launch
  # failure above was "Could not launch Spot Instances ... not eligible for
  # Free Tier". scale.sh still works exactly the same on ON_DEMAND.
  eks_node_capacity_type: ON_DEMAND
  eks_node_count_desired: 1
  # 0 so `./scale.sh dev 0` is allowed -- AWS rejects desired_size 0 while
  # min_size is 1. See the cost note on node_count_min in modules/eks.
  eks_node_count_min: 0
  eks_node_count_max: 3

  # Pin the node group to ONE availability zone.
  #
  # WHY: an EBS volume lives in exactly one AZ, and so must the pod that mounts
  # it. With a single node free to land in either AZ, scaling back up from 0
  # has a ~50% chance of stranding the Postgres pod as Pending with
  # "volume node affinity conflict".
  #
  # The control plane still spans both AZs (az_suffixes above) because EKS
  # requires it. Only the nodes are pinned.
  #
  # Set this to [] once you run 2+ nodes with no AZ-locked state, or once
  # Postgres moves to RDS.
  eks_node_az_suffixes: ["a"]
  eks_node_disk_size_gb: 20

  # REQUIRED for this app: the in-cluster Postgres uses a PVC, and without the
  # EBS CSI driver that PVC stays Pending forever with no obvious cause.
  eks_enable_ebs_csi_driver: true

  tags:
    Environment: dev
    Project: nimbus-store
    Owner: shashank
