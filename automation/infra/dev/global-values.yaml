# ============================================================================
# Every value that defines the "dev" environment. One file, so a second
# environment is a copy of this directory with this file edited.
#
# COST NOTE -- what actually bills here (credits, not free-tier resources):
#
#   EKS control plane   $0.10/hr    ~$73/month   <- flat, no free tier, ever
#   1x t3.medium SPOT   ~$0.0125/hr ~$9/month    <- ~70% off on-demand
#   node root EBS 20GB  ~$1.60/month
#   Postgres PVC 8GB    ~$0.64/month
#   NAT Gateway         $0                       <- not created; see modules/network
#   Load Balancer       $0                       <- not created; use port-forward
#   -----------------------------------------------------------------------
#   running, 1 node     ~$0.115/hr = ~$2.75/day = ~$84/month
#   scaled to 0 nodes   ~$0.101/hr             = ~$74/month  (saves ~13%)
#   destroyed           ~$0/month
#
# The control plane is ~87% of the bill at one node and is charged per hour
# from cluster creation to cluster deletion regardless of load. So:
#   ./scale.sh dev 0   -> back tomorrow; keeps cluster, releases and data
#   ./destroy.sh dev   -> done for a while; the only real saving
# ============================================================================

global:
  # Prefix for every resource name. Keep it short: several AWS names have
  # tight length limits and EKS appends its own suffixes.
  name_prefix: shop-dev

  aws_region: ap-south-1

  # --- network -------------------------------------------------------------
  vpc_cidr: "10.20.0.0/16"
  # Two AZs is the MINIMUM -- EKS rejects a single-AZ cluster outright.
  az_suffixes: ["a", "b"]

  # --- eks control plane ---------------------------------------------------
  eks_cluster_version: "1.33"
  # true so kubectl reaches the cluster from your laptop with no VPN/bastion.
  eks_endpoint_public_access: true
  # Narrow this to "YOUR.PUBLIC.IP/32". It is free and strictly better than
  # letting the whole internet attempt to authenticate.
  eks_public_access_cidrs: ["0.0.0.0/0"]
  # Empty on purpose: control plane logging bills by ingestion and "audit" is
  # high volume. Add ["api", "audit"] temporarily to debug authorisation.
  eks_cluster_log_types: []

  # --- eks nodes -----------------------------------------------------------
  # t3.medium allows 17 pods/node. t3.small allows only 11, and kube-system
  # takes 4-5 of those. See modules/eks/variables.tf for the full table.
  eks_node_instance_type: t3.medium
  # SPOT: ~70% cheaper, reclaimable with 2 minutes' notice. Good for learning
  # precisely because it exercises your PodDisruptionBudget for real.
  eks_node_capacity_type: SPOT
  eks_node_count_desired: 1
  # 0 so `./scale.sh dev 0` is allowed -- AWS rejects desired_size 0 while
  # min_size is 1. See the cost note on node_count_min in modules/eks.
  eks_node_count_min: 0
  eks_node_count_max: 3

  # Pin the node group to ONE availability zone.
  #
  # WHY: an EBS volume lives in exactly one AZ, and so must the pod that mounts
  # it. With a single node free to land in either AZ, scaling back up from 0
  # has a ~50% chance of stranding the Postgres pod as Pending with
  # "volume node affinity conflict".
  #
  # The control plane still spans both AZs (az_suffixes above) because EKS
  # requires it. Only the nodes are pinned.
  #
  # Set this to [] once you run 2+ nodes with no AZ-locked state, or once
  # Postgres moves to RDS.
  eks_node_az_suffixes: ["a"]
  eks_node_disk_size_gb: 20

  # REQUIRED for this app: the in-cluster Postgres uses a PVC, and without the
  # EBS CSI driver that PVC stays Pending forever with no obvious cause.
  eks_enable_ebs_csi_driver: true

  tags:
    Environment: dev
    Project: nimbus-store
    Owner: shashank
