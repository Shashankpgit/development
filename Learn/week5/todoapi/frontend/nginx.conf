server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Normalize trailing slash BEFORE hitting the backend ---
    # Matches bare collection URLs like /api/v1/todos and /api/v1/todos?params
    # Does NOT match /api/v1/todos/1 or /api/v1/todos/stats/summary (extra path segments)
    rewrite ^(/api/v[0-9]+/[a-z]+)$ $1/ last;

    # Serve static files — no-cache so browser always gets fresh JS/HTML
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://todo-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
