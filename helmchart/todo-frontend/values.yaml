replicaCount: 1

image:
  repository: todo-frontend
  tag: latest
  pullPolicy: Never   # Use local minikube image

service:
  type: NodePort
  port: 80
  nodePort: 30080

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

livenessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  path: /health
  initialDelaySeconds: 3
  periodSeconds: 10
