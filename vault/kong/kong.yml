_format_version: "3.0"

services:
  - name: vault-api
    url: http://api:8000
    routes:
      - name: vault-api-route
        paths:
          - /
        strip_path: false

consumers:
  - username: keycloak-issuer
    jwt_secrets:
      - key: http://localhost:8080/realms/vault
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqCoUkhyToUTyn0IXip7z
          0NM2cDSdw8Cjj8zBmNAo1HkByk8n7Q5EgpFZhehMjtLhPs6VNg+RdFK9S3EyN00N
          +SG2R3Llj49HzE1q4P1tP25dM+7lM5rwSdkujOSDAVFfTdUIDWIFK6hU6JErxlWA
          7TQBpCApOne9goNSZTxWG5vUlLcV30N3LUDzYNj7n7x7NTpUZDHoZP0660EDd2kP
          s2UVuXqb4i3DC6a8BHALCxExwXzGZ6J1Il0Mjqvijp0jVVsFmp9tBjvjfwL4sEfN
          OaQ4PdBmR2MHC2bBpJNl52QNOn9s6vBIHw06wKDELyl3LPzo3EBKDfhA/NY/xoM+
          qwIDAQAB
          -----END PUBLIC KEY-----

plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local

  - name: cors
    config:
      origins:
        - http://localhost
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true

  - name: jwt
    service: vault-api
    config:
      key_claim_name: iss
      claims_to_verify:
        - exp
