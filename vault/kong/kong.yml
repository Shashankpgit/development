_format_version: "3.0"

services:
  - name: vault-api
    url: http://api:8000
    routes:
      - name: vault-api-route
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local

  - name: cors
    config:
      origins:
        - http://localhost
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true
