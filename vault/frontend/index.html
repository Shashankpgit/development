<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Vault</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <header>
    <h1>Personal Vault</h1>
  </header>

  <main>

    <!-- Health check section -->
    <section id="health-section">
      <h2>Server Status</h2>
      <button id="check-health-btn">Check Health</button>
      <p id="health-result"></p>
    </section>

    <!-- Create note section -->
    <section id="create-note-section">
      <h2>New Note</h2>
      <div class="form-group">
        <input type="number" id="new-note-user-id" placeholder="User ID" value="1" />
        <input type="text" id="new-note-title" placeholder="Title" />
        <textarea id="new-note-body" placeholder="Body (optional)" rows="3"></textarea>
        <button id="save-note-btn">Save Note</button>
        <p id="save-note-result"></p>
      </div>
    </section>

    <!-- Notes section -->
    <section id="notes-section">
      <h2>Notes</h2>
      <div class="input-row">
        <input type="number" id="notes-user-id" placeholder="User ID" value="1" />
        <button id="load-notes-btn">Load Notes</button>
      </div>
      <ul id="notes-list"></ul>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
