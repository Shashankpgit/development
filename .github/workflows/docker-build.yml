# .github/workflows/build-docker.yml
name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      week3:
        description: 'Build week3'
        type: boolean
        default: false
      week4:
        description: 'Build week4'
        type: boolean
        default: false
      week5:
        description: 'Build week5'
        type: boolean
        default: false

jobs:
  build-week3:
    if: ${{ inputs.week3 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./Learn/week3
          push: true
          tags: ghcr.io/${{ github.repository }}/week3:latest

  build-week4:
    if: ${{ inputs.week4 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./Learn/week4
          push: true
          tags: ghcr.io/${{ github.repository }}/week4:latest

  build-week5:
    if: ${{ inputs.week5 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./Learn/week5
          push: true
          tags: ghcr.io/${{ github.repository }}/week5:latest